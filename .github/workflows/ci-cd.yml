# CI/CD pipeline for the personal website.
#
#   CI  (Continuous Integration) = every push / pull request runs the checks.
#   CD  (Continuous Deployment)  = if the checks pass on `main`, deploy to GitHub Pages.
#
# Flow:  push → [check] → (only on main) → [deploy] → live site updated

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# Permissions GitHub Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, cancel the older deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- CI ----------------
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate HTML
        run: npm run lint

      - name: Check for broken links/images
        run: npm test

  # ---------------- CD ----------------
  deploy:
    name: Deploy to GitHub Pages
    needs: check # only runs if `check` passed
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Cache busting: give CSS/JS/favicon a new URL on every deploy
      # (e.g. css/style.css?v=1a2b3c4), so browsers and Cloudflare
      # can never serve an old cached copy with new HTML.
      - name: Stamp asset URLs with commit id
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${VERSION}/g" site/index.html
          echo "Stamped assets with version ${VERSION}"
          grep -n "?v=${VERSION}" site/index.html

      - name: Upload site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
